{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="{% static 'css/login-themes.css' %}">
    <link href="{% static 'css/back-button-sci-fi.css' %}" rel="stylesheet">
    <title>Login - Futuristic Interface</title>
</head>

<body>
    <!-- Sci-Fi Back Button -->
    <button class="sci-fi-back-button" onclick="goBack()" title="Back to Previous Page">
        <div class="hologram-shimmer"></div>
        <i class="fas fa-arrow-left back-icon"></i>
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
    </button>

    <div id="particles-js"></div>

    <div class="login-container">
        <div class="command-sentence" id="command-sentence"></div>

        <form class="login-form" action="" method="POST">
            {% csrf_token %}

            <div class="form-outline">
                <label class="form-label" for="email">Email address</label>
                <input type="email" name="email" id="email" class="form-control"
                    placeholder="Enter a valid email address" required />
            </div>

            <div class="form-outline">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control"
                    placeholder="Enter password" required />
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="remember" />
                    <label class="form-check-label" for="remember">
                        Remember me
                    </label>
                </div>
                <a href="#!" class="text-body">Forgot password?</a>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">Login</button>
                <p class="small fw-bold mt-2 mb-0">Don't have an account? <a href="signup" class="link-danger">Register</a></p>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="{% static 'js/particles.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>

    <script>
        function goBack() {
            const button = document.querySelector('.sci-fi-back-button');
            button.classList.add('clicked');
            setTimeout(() => {
                window.history.back();
            }, 300);
        }
    </script>
</body>

</html>
