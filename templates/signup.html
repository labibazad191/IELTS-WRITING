{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/login-themes.css' %}">
    <title>Sign Up - Futuristic Interface</title>
</head>

<body class="signup">
    <div id="particles-js"></div>

    <div class="login-container">
        <div class="command-sentence" id="command-sentence"></div>

        <form class="login-form" action="" method="POST">
            {% csrf_token %}

            {% if messages %}
            {% for message in messages %}
              <div class="{% if message.tags %}alert alert-{{ message.tags }}{% endif %}" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}

            <div class="form-outline">
                <label class="form-label" for="fname">First Name</label>
                <div class="input-with-icon">
                    <i class="fas fa-user-astronaut"></i>
                    <input type="text" name="fname" id="fname" class="form-control"
                        placeholder="Enter your first name" required />
                </div>
            </div>

            <div class="form-outline">
                <label class="form-label" for="lname">Last Name</label>
                <div class="input-with-icon">
                    <i class="fas fa-user-astronaut"></i>
                    <input type="text" name="lname" id="lname" class="form-control"
                        placeholder="Enter your last name" required />
                </div>
            </div>

            <div class="form-outline">
                <label class="form-label" for="email">Email address</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email" class="form-control"
                        placeholder="Enter a valid email address" required />
                </div>
            </div>

            <div class="form-outline">
                <label class="form-label" for="password">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" class="form-control"
                        placeholder="Enter password" required />
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">Initiate Registration</button>
                <p class="small fw-bold mt-2 mb-0">Already have access? <a href="/login" class="link-danger">Log in</a></p>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="{% static 'js/particles.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>
</body>

</html>
